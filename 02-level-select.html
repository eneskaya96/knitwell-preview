<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knitwell - Level Select</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Nunito', sans-serif;
    background: #FFF5E6;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .phone {
    width: 390px;
    min-height: 844px;
    background: linear-gradient(180deg, #FFF5E6 0%, #FFE8D0 100%);
    position: relative;
    overflow: hidden;
  }

  /* Header */
  .header {
    padding: 56px 24px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
    z-index: 2;
  }
  .back-btn {
    width: 44px; height: 44px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(20px);
    border-radius: 50%;
    border: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(61,53,53,0.06);
  }
  .header-title {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 22px;
    color: #2D2B3D;
  }
  .stars-badge {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(20px);
    padding: 8px 14px;
    border-radius: 50px;
    box-shadow: 0 4px 16px rgba(61,53,53,0.06);
  }
  .stars-badge span {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: #FF8C42;
  }

  /* Chapter banner */
  .chapter-banner {
    margin: 0 24px 20px;
    background: linear-gradient(135deg, #A66DD4, #FF6B9D);
    border-radius: 2rem;
    padding: 20px 24px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(166,109,212,0.3);
  }
  .chapter-banner::before {
    content: '';
    position: absolute;
    top: -20px; right: -20px;
    width: 100px; height: 100px;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
  }
  .chapter-banner::after {
    content: '';
    position: absolute;
    bottom: -30px; left: 30px;
    width: 80px; height: 80px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
  }
  .chapter-label {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 12px;
    color: rgba(255,255,255,0.75);
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .chapter-name {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 24px;
    color: white;
    margin: 4px 0 8px;
  }
  .chapter-progress {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .chapter-bar-bg {
    flex: 1;
    height: 8px;
    background: rgba(255,255,255,0.2);
    border-radius: 50px;
    overflow: hidden;
  }
  .chapter-bar-fill {
    height: 100%;
    width: 40%;
    background: white;
    border-radius: 50px;
  }
  .chapter-pct {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: white;
  }

  /* Level path */
  .level-path {
    padding: 0 24px 120px;
    position: relative;
    z-index: 2;
  }
  .path-line {
    position: absolute;
    left: 50%;
    top: 0;
    width: 4px;
    height: 100%;
    background: repeating-linear-gradient(
      to bottom,
      #E8A0BF 0px, #E8A0BF 10px,
      transparent 10px, transparent 20px
    );
    border-radius: 2px;
    transform: translateX(-50%);
    z-index: 0;
  }

  .level-row {
    display: flex;
    align-items: center;
    margin-bottom: 20px;
    position: relative;
    z-index: 1;
  }
  .level-row.left { justify-content: flex-start; padding-left: 20px; }
  .level-row.center { justify-content: center; }
  .level-row.right { justify-content: flex-end; padding-right: 20px; }

  .level-node {
    width: 72px; height: 72px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    transition: transform 0.15s ease;
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
  }
  .level-node:active { transform: scale(0.93); }

  .level-node.completed {
    background: linear-gradient(135deg, #4ECDC4, #A66DD4);
    box-shadow: 0 6px 20px rgba(78,205,196,0.3);
  }
  .level-node.current {
    background: linear-gradient(135deg, #FF6B9D, #E8A0BF);
    box-shadow: 0 6px 24px rgba(255,107,157,0.4);
    animation: currentPulse 2s ease-in-out infinite;
  }
  .level-node.locked {
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 12px rgba(61,53,53,0.06);
  }

  @keyframes currentPulse {
    0%, 100% { box-shadow: 0 6px 24px rgba(255,107,157,0.4); }
    50% { box-shadow: 0 6px 36px rgba(255,107,157,0.6); }
  }

  .level-num {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 22px;
    color: white;
  }
  .level-node.locked .level-num {
    color: #D5C2C7;
    font-size: 18px;
  }

  .level-stars {
    display: flex;
    gap: 2px;
    margin-top: 2px;
  }
  .level-stars span {
    font-size: 10px;
    opacity: 0.9;
  }

  .level-tag {
    position: absolute;
    top: -8px; right: -8px;
    background: #FFD93D;
    border-radius: 50px;
    padding: 2px 8px;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 9px;
    color: #2D2B3D;
    box-shadow: 0 2px 8px rgba(255,217,61,0.4);
  }

  .level-label {
    position: absolute;
    bottom: -22px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 11px;
    color: #837378;
    white-space: nowrap;
  }

  /* Floating decoration */
  .yarn-deco {
    position: absolute;
    border-radius: 50%;
    opacity: 0.12;
  }
  .yarn-deco:nth-child(1) { width: 80px; height: 80px; background: #FFD93D; top: 100px; right: -20px; }
  .yarn-deco:nth-child(2) { width: 60px; height: 60px; background: #4ECDC4; top: 350px; left: -15px; }
  .yarn-deco:nth-child(3) { width: 90px; height: 90px; background: #FF6B9D; bottom: 200px; right: -30px; }

  /* Bottom nav */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    width: 390px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(20px);
    border-radius: 2rem 2rem 0 0;
    padding: 12px 16px 32px;
    display: flex;
    justify-content: space-around;
    z-index: 10;
    box-shadow: 0 -4px 24px rgba(61,53,53,0.06);
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    border: none; background: none; cursor: pointer; padding: 6px 12px;
  }
  .nav-icon {
    font-size: 22px; width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 1rem;
  }
  .nav-item.active .nav-icon {
    background: linear-gradient(135deg, #FF6B9D, #E8A0BF);
    box-shadow: 0 4px 12px rgba(255,107,157,0.3);
  }
  .nav-label {
    font-family: 'Inter', sans-serif;
    font-weight: 600; font-size: 10px; color: #837378;
  }
  .nav-item.active .nav-label { color: #FF6B9D; }
</style>
</head>
<body>
<div class="phone">
  <div class="yarn-deco"></div>
  <div class="yarn-deco"></div>
  <div class="yarn-deco"></div>

  <!-- Header -->
  <div class="header">
    <button class="back-btn">&#8592;</button>
    <div class="header-title">Levels</div>
    <div class="stars-badge">
      <span>&#11088;</span>
      <span>127/180</span>
    </div>
  </div>

  <!-- Chapter banner -->
  <div class="chapter-banner">
    <div class="chapter-label">Chapter 4</div>
    <div class="chapter-name">Cozy Meadow &#127807;</div>
    <div class="chapter-progress">
      <div class="chapter-bar-bg">
        <div class="chapter-bar-fill"></div>
      </div>
      <div class="chapter-pct">40%</div>
    </div>
  </div>

  <!-- Level path -->
  <div class="level-path">
    <div class="path-line"></div>

    <div class="level-row center">
      <div class="level-node completed">
        <div class="level-num">44</div>
        <div class="level-stars"><span>&#11088;</span><span>&#11088;</span><span>&#11088;</span></div>
      </div>
    </div>

    <div class="level-row right">
      <div class="level-node completed">
        <div class="level-num">45</div>
        <div class="level-stars"><span>&#11088;</span><span>&#11088;</span><span style="opacity:0.3">&#11088;</span></div>
      </div>
    </div>

    <div class="level-row center">
      <div class="level-node completed">
        <div class="level-num">46</div>
        <div class="level-stars"><span>&#11088;</span><span>&#11088;</span><span>&#11088;</span></div>
        <div class="level-tag">HARD</div>
      </div>
    </div>

    <div class="level-row left">
      <div class="level-node completed">
        <div class="level-num">47</div>
        <div class="level-stars"><span>&#11088;</span><span>&#11088;</span><span style="opacity:0.3">&#11088;</span></div>
      </div>
    </div>

    <div class="level-row center">
      <div class="level-node current">
        <div class="level-num">48</div>
        <div class="level-label">Cozy Meadow</div>
      </div>
    </div>

    <div class="level-row right">
      <div class="level-node locked">
        <div class="level-num">&#128274;</div>
      </div>
    </div>

    <div class="level-row center">
      <div class="level-node locked">
        <div class="level-num">&#128274;</div>
      </div>
    </div>

    <div class="level-row left">
      <div class="level-node locked">
        <div class="level-num">&#128274;</div>
      </div>
    </div>

    <div class="level-row center">
      <div class="level-node locked">
        <div class="level-num">&#128274;</div>
        <div class="level-tag" style="background: #A66DD4; color: white;">BOSS</div>
      </div>
    </div>

    <div class="level-row right">
      <div class="level-node locked">
        <div class="level-num">&#128274;</div>
      </div>
    </div>
  </div>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <button class="nav-item">
      <div class="nav-icon">&#127968;</div>
      <span class="nav-label">Home</span>
    </button>
    <button class="nav-item active">
      <div class="nav-icon">&#127922;</div>
      <span class="nav-label">Levels</span>
    </button>
    <button class="nav-item">
      <div class="nav-icon">&#129526;</div>
      <span class="nav-label">Collect</span>
    </button>
    <button class="nav-item">
      <div class="nav-icon">&#128722;</div>
      <span class="nav-label">Shop</span>
    </button>
  </nav>
</div>
</body>
</html>
