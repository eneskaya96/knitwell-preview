<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knitwell - Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Nunito', sans-serif;
    background: #FFF5E6;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .phone {
    width: 390px;
    min-height: 844px;
    background: linear-gradient(180deg, #FFF5E6 0%, #FFE8D0 100%);
    position: relative;
    overflow: hidden;
    padding-bottom: 100px;
  }

  /* Floating deco */
  .deco {
    position: absolute;
    border-radius: 50%;
    opacity: 0.1;
    animation: floatDeco 6s ease-in-out infinite;
  }
  .deco:nth-child(1) { width: 90px; height: 90px; background: #A66DD4; top: -20px; right: -20px; animation-delay: 0s; }
  .deco:nth-child(2) { width: 60px; height: 60px; background: #4ECDC4; top: 300px; left: -15px; animation-delay: 1s; }
  .deco:nth-child(3) { width: 70px; height: 70px; background: #FFD93D; bottom: 200px; right: -20px; animation-delay: 2s; }
  @keyframes floatDeco {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  /* Header */
  .header {
    padding: 56px 24px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
    z-index: 2;
  }
  .back-btn {
    width: 44px; height: 44px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(20px);
    border-radius: 50%;
    border: none;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(61,53,53,0.06);
    display: flex; align-items: center; justify-content: center;
  }
  .header-title {
    font-weight: 800;
    font-size: 22px;
    color: #2D2B3D;
  }

  /* Collection stats */
  .collection-stats {
    margin: 0 24px 20px;
    background: linear-gradient(135deg, #A66DD4, #FF6B9D);
    border-radius: 2rem;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 2;
    box-shadow: 0 8px 32px rgba(166,109,212,0.25);
    overflow: hidden;
  }
  .collection-stats::before {
    content: '';
    position: absolute;
    top: -30px; right: -20px;
    width: 100px; height: 100px;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
  }
  .coll-stat-info h3 {
    font-weight: 900;
    font-size: 28px;
    color: white;
  }
  .coll-stat-info p {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 13px;
    color: rgba(255,255,255,0.7);
  }
  .coll-progress-ring {
    width: 64px; height: 64px;
    position: relative;
  }
  .coll-progress-ring svg {
    width: 64px; height: 64px;
    transform: rotate(-90deg);
  }
  .coll-progress-ring circle {
    fill: none;
    stroke-width: 6;
    stroke-linecap: round;
  }
  .coll-progress-ring .bg { stroke: rgba(255,255,255,0.2); }
  .coll-progress-ring .fg { stroke: white; stroke-dasharray: 157; stroke-dashoffset: 50; }
  .coll-pct {
    position: absolute;
    inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    font-size: 16px;
    color: white;
  }

  /* Tab filters */
  .tabs {
    display: flex;
    gap: 8px;
    padding: 0 24px 16px;
    overflow-x: auto;
    position: relative;
    z-index: 2;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 8px 18px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    white-space: nowrap;
    transition: all 0.2s ease;
  }
  .tab.active {
    background: linear-gradient(135deg, #FF6B9D, #E8A0BF);
    color: white;
    box-shadow: 0 4px 12px rgba(255,107,157,0.3);
  }
  .tab:not(.active) {
    background: rgba(255,255,255,0.7);
    color: #837378;
  }

  /* Collection grid */
  .collection-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    padding: 0 24px;
    position: relative;
    z-index: 2;
  }
  .pattern-card {
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(20px);
    border-radius: 2rem;
    padding: 20px 16px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(61,53,53,0.05);
    transition: transform 0.15s ease;
    cursor: pointer;
  }
  .pattern-card:active { transform: scale(0.96); }
  .pattern-card.locked {
    opacity: 0.5;
  }

  .pattern-preview {
    width: 80px; height: 80px;
    margin: 0 auto 12px;
    border-radius: 1.5rem;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    position: relative;
    overflow: hidden;
  }
  .pattern-preview.p1 { background: linear-gradient(135deg, #FF6B9D, #E8A0BF); }
  .pattern-preview.p2 { background: linear-gradient(135deg, #4ECDC4, #A66DD4); }
  .pattern-preview.p3 { background: linear-gradient(135deg, #FFD93D, #FF8C42); }
  .pattern-preview.p4 { background: linear-gradient(135deg, #A66DD4, #FF6B9D); }
  .pattern-preview.p5 { background: linear-gradient(135deg, #FF8C42, #FFD93D); }
  .pattern-preview.p6 { background: linear-gradient(135deg, #4ECDC4, #FFD93D); }
  .pattern-preview.locked-bg { background: #E4D7D6; }

  /* Knit pattern overlay */
  .pattern-preview::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(0deg, transparent 0px, transparent 8px, rgba(255,255,255,0.1) 8px, rgba(255,255,255,0.1) 10px),
      repeating-linear-gradient(90deg, transparent 0px, transparent 8px, rgba(255,255,255,0.1) 8px, rgba(255,255,255,0.1) 10px);
  }

  .pattern-name {
    font-weight: 700;
    font-size: 14px;
    color: #2D2B3D;
    margin-bottom: 4px;
  }
  .pattern-rarity {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 50px;
    display: inline-block;
  }
  .rarity-common { background: #D1E9D3; color: #374C3C; }
  .rarity-rare { background: #E8A0BF; color: #6B344F; }
  .rarity-epic { background: #A66DD4; color: white; }
  .rarity-legendary { background: linear-gradient(135deg, #FFD93D, #FF8C42); color: #2D2B3D; }

  .lock-overlay {
    font-size: 28px;
  }
  .pattern-card.locked .pattern-name { color: #D5C2C7; }

  /* Bottom nav */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    width: 390px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(20px);
    border-radius: 2rem 2rem 0 0;
    padding: 12px 16px 32px;
    display: flex;
    justify-content: space-around;
    z-index: 10;
    box-shadow: 0 -4px 24px rgba(61,53,53,0.06);
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    border: none; background: none; cursor: pointer; padding: 6px 12px;
  }
  .nav-icon {
    font-size: 22px; width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 1rem;
  }
  .nav-item.active .nav-icon {
    background: linear-gradient(135deg, #FF6B9D, #E8A0BF);
    box-shadow: 0 4px 12px rgba(255,107,157,0.3);
  }
  .nav-label {
    font-family: 'Inter', sans-serif;
    font-weight: 600; font-size: 10px; color: #837378;
  }
  .nav-item.active .nav-label { color: #FF6B9D; }
</style>
</head>
<body>
<div class="phone">
  <div class="deco"></div>
  <div class="deco"></div>
  <div class="deco"></div>

  <!-- Header -->
  <div class="header">
    <button class="back-btn">&#8592;</button>
    <div class="header-title">My Collection</div>
  </div>

  <!-- Collection stats -->
  <div class="collection-stats">
    <div class="coll-stat-info">
      <h3>24/36</h3>
      <p>Patterns Collected</p>
    </div>
    <div class="coll-progress-ring">
      <svg><circle class="bg" cx="32" cy="32" r="25"/><circle class="fg" cx="32" cy="32" r="25"/></svg>
      <div class="coll-pct">67%</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active">All</button>
    <button class="tab">Common</button>
    <button class="tab">Rare</button>
    <button class="tab">Epic</button>
    <button class="tab">Legendary</button>
  </div>

  <!-- Collection grid -->
  <div class="collection-grid">
    <div class="pattern-card">
      <div class="pattern-preview p1">&#129526;</div>
      <div class="pattern-name">Rose Stitch</div>
      <div class="pattern-rarity rarity-rare">Rare</div>
    </div>
    <div class="pattern-card">
      <div class="pattern-preview p2">&#129526;</div>
      <div class="pattern-name">Ocean Wave</div>
      <div class="pattern-rarity rarity-epic">Epic</div>
    </div>
    <div class="pattern-card">
      <div class="pattern-preview p3">&#129526;</div>
      <div class="pattern-name">Sunburst</div>
      <div class="pattern-rarity rarity-legendary">Legendary</div>
    </div>
    <div class="pattern-card">
      <div class="pattern-preview p4">&#129526;</div>
      <div class="pattern-name">Berry Twist</div>
      <div class="pattern-rarity rarity-common">Common</div>
    </div>
    <div class="pattern-card">
      <div class="pattern-preview p5">&#129526;</div>
      <div class="pattern-name">Ember Coil</div>
      <div class="pattern-rarity rarity-rare">Rare</div>
    </div>
    <div class="pattern-card">
      <div class="pattern-preview p6">&#129526;</div>
      <div class="pattern-name">Meadow Loop</div>
      <div class="pattern-rarity rarity-common">Common</div>
    </div>
    <div class="pattern-card locked">
      <div class="pattern-preview locked-bg"><div class="lock-overlay">&#128274;</div></div>
      <div class="pattern-name">Crystal Lace</div>
      <div class="pattern-rarity rarity-epic">Epic</div>
    </div>
    <div class="pattern-card locked">
      <div class="pattern-preview locked-bg"><div class="lock-overlay">&#128274;</div></div>
      <div class="pattern-name">Starlight</div>
      <div class="pattern-rarity rarity-legendary">Legendary</div>
    </div>
  </div>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <button class="nav-item">
      <div class="nav-icon">&#127968;</div>
      <span class="nav-label">Home</span>
    </button>
    <button class="nav-item">
      <div class="nav-icon">&#127922;</div>
      <span class="nav-label">Levels</span>
    </button>
    <button class="nav-item active">
      <div class="nav-icon">&#129526;</div>
      <span class="nav-label">Collect</span>
    </button>
    <button class="nav-item">
      <div class="nav-icon">&#128722;</div>
      <span class="nav-label">Shop</span>
    </button>
  </nav>
</div>
</body>
</html>
